<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2a4a"/>
      <stop offset="50%" stop-color="#3a5a8a"/>
      <stop offset="100%" stop-color="#5a7aaa"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3a2a"/>
      <stop offset="100%" stop-color="#1a2a1a"/>
    </linearGradient>
    <linearGradient id="tvsphere" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c0c8d8"/>
      <stop offset="100%" stop-color="#7a8898"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- Stars -->
  <circle cx="80" cy="40" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="150" cy="25" r="1" fill="white" opacity="0.6"/>
  <circle cx="220" cy="55" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="320" cy="30" r="1" fill="white" opacity="0.5"/>
  <circle cx="480" cy="45" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="600" cy="20" r="1" fill="white" opacity="0.6"/>
  <circle cx="680" cy="50" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="750" cy="35" r="1" fill="white" opacity="0.5"/>

  <!-- Moon -->
  <circle cx="680" cy="70" r="28" fill="#d4dce8" opacity="0.9"/>
  <circle cx="694" cy="62" r="22" fill="#3a5a8a"/>

  <!-- Distant skyline -->
  <rect x="0" y="280" width="800" height="120" fill="#1e2e3e" opacity="0.7"/>

  <!-- Background buildings -->
  <rect x="0" y="240" width="60" height="60" fill="#1a2a3a"/>
  <rect x="70" y="250" width="45" height="50" fill="#1a2a3a"/>
  <rect x="580" y="235" width="55" height="65" fill="#1a2a3a"/>
  <rect x="645" y="245" width="40" height="55" fill="#1a2a3a"/>
  <rect x="700" y="238" width="50" height="62" fill="#1a2a3a"/>
  <rect x="760" y="248" width="40" height="52" fill="#1a2a3a"/>
  <!-- lit windows bg buildings -->
  <rect x="10" y="248" width="10" height="12" fill="#f4d35e" opacity="0.4"/>
  <rect x="28" y="248" width="10" height="12" fill="#f4d35e" opacity="0.3"/>
  <rect x="590" y="242" width="10" height="12" fill="#f4d35e" opacity="0.5"/>
  <rect x="710" y="245" width="10" height="12" fill="#f4d35e" opacity="0.4"/>

  <!-- Brandenburg Gate — centered -->
  <!-- Main entablature -->
  <rect x="270" y="250" width="260" height="30" fill="#8a7a6a"/>
  <rect x="260" y="242" width="280" height="12" fill="#9a8a78"/>
  <!-- Columns -->
  <rect x="278" y="280" width="22" height="80" fill="#9a8a78"/>
  <rect x="316" y="280" width="22" height="80" fill="#9a8a78"/>
  <rect x="354" y="280" width="22" height="80" fill="#9a8a78"/>
  <rect x="392" y="280" width="22" height="80" fill="#9a8a78"/>
  <rect x="430" y="280" width="22" height="80" fill="#9a8a78"/>
  <rect x="468" y="280" width="22" height="80" fill="#9a8a78"/>
  <!-- Column bases -->
  <rect x="274" y="356" width="30" height="8" fill="#7a6a5a"/>
  <rect x="312" y="356" width="30" height="8" fill="#7a6a5a"/>
  <rect x="350" y="356" width="30" height="8" fill="#7a6a5a"/>
  <rect x="388" y="356" width="30" height="8" fill="#7a6a5a"/>
  <rect x="426" y="356" width="30" height="8" fill="#7a6a5a"/>
  <rect x="464" y="356" width="30" height="8" fill="#7a6a5a"/>
  <!-- Column tops -->
  <rect x="274" y="278" width="30" height="6" fill="#7a6a5a"/>
  <rect x="312" y="278" width="30" height="6" fill="#7a6a5a"/>
  <rect x="350" y="278" width="30" height="6" fill="#7a6a5a"/>
  <rect x="388" y="278" width="30" height="6" fill="#7a6a5a"/>
  <rect x="426" y="278" width="30" height="6" fill="#7a6a5a"/>
  <rect x="464" y="278" width="30" height="6" fill="#7a6a5a"/>
  <!-- Attic / upper section -->
  <rect x="268" y="215" width="264" height="30" fill="#7a6a58"/>
  <rect x="265" y="210" width="270" height="8" fill="#8a7a68"/>
  <!-- Quadriga platform -->
  <rect x="340" y="185" width="120" height="30" fill="#8a7a68"/>
  <!-- Quadriga horses (simplified) -->
  <ellipse cx="370" cy="175" rx="18" ry="12" fill="#6a5a48"/>
  <ellipse cx="400" cy="170" rx="18" ry="12" fill="#6a5a48"/>
  <ellipse cx="430" cy="175" rx="18" ry="12" fill="#6a5a48"/>
  <!-- Chariot -->
  <ellipse cx="400" cy="172" rx="28" ry="10" fill="#5a4a38"/>
  <!-- Victoria figure -->
  <rect x="396" y="155" width="8" height="20" fill="#6a5a48"/>
  <circle cx="400" cy="152" r="6" fill="#6a5a48"/>
  <!-- Sides of gate -->
  <rect x="200" y="270" width="70" height="90" fill="#8a7a6a"/>
  <rect x="530" y="270" width="70" height="90" fill="#8a7a6a"/>
  <rect x="200" y="262" width="70" height="12" fill="#9a8a78"/>
  <rect x="530" y="262" width="70" height="12" fill="#9a8a78"/>

  <!-- Unter den Linden road -->
  <rect x="0" y="360" width="800" height="20" fill="#2a3030"/>
  <rect x="0" y="365" width="800" height="3" fill="#3a4040" opacity="0.5"/>
  <!-- Road markings -->
  <rect x="50" y="366" width="40" height="3" fill="#888" opacity="0.4"/>
  <rect x="130" y="366" width="40" height="3" fill="#888" opacity="0.4"/>
  <rect x="590" y="366" width="40" height="3" fill="#888" opacity="0.4"/>
  <rect x="670" y="366" width="40" height="3" fill="#888" opacity="0.4"/>

  <!-- Ground / pavement -->
  <rect x="0" y="380" width="800" height="120" fill="url(#ground)"/>

  <!-- TV Tower (Fernsehturm) — right side -->
  <!-- Shaft -->
  <rect x="648" y="80" width="14" height="260" fill="#c0c8d8"/>
  <!-- Sphere -->
  <circle cx="655" cy="155" r="42" fill="url(#tvsphere)"/>
  <!-- Sphere cross detail -->
  <path d="M635,155 Q655,138 675,155 Q655,172 635,155" fill="rgba(255,255,255,0.2)"/>
  <rect x="651" y="115" width="8" height="80" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <!-- Antenna top -->
  <rect x="652" y="30" width="6" height="55" fill="#a8b0c0"/>
  <rect x="651" y="25" width="8" height="8" fill="#d0d8e0"/>
  <!-- Sphere light flare -->
  <circle cx="640" cy="143" r="8" fill="rgba(255,255,255,0.3)"/>

  <!-- Trees lining the avenue -->
  <rect x="130" y="330" width="6" height="32" fill="#3a4a2a"/>
  <circle cx="133" cy="320" r="18" fill="#2a4a20"/>
  <rect x="160" y="328" width="6" height="34" fill="#3a4a2a"/>
  <circle cx="163" cy="318" r="16" fill="#334a28"/>
  <rect x="190" y="332" width="6" height="30" fill="#3a4a2a"/>
  <circle cx="193" cy="323" r="14" fill="#2a4a20"/>

  <rect x="610" y="330" width="6" height="32" fill="#3a4a2a"/>
  <circle cx="613" cy="320" r="18" fill="#2a4a20"/>
  <rect x="580" y="328" width="6" height="34" fill="#3a4a2a"/>
  <circle cx="583" cy="318" r="16" fill="#334a28"/>

  <!-- Street lights -->
  <rect x="120" y="320" width="3" height="45" fill="#888"/>
  <circle cx="121" cy="318" r="5" fill="#f4d35e" opacity="0.8" filter="url(#glow)"/>
  <rect x="540" y="320" width="3" height="45" fill="#888"/>
  <circle cx="541" cy="318" r="5" fill="#f4d35e" opacity="0.8" filter="url(#glow)"/>
</svg>
