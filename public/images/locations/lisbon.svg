<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a78c2"/>
      <stop offset="55%" stop-color="#58aae8"/>
      <stop offset="100%" stop-color="#90c8f0"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2870b0"/>
      <stop offset="100%" stop-color="#1a4878"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8d090"/>
      <stop offset="100%" stop-color="#c8a868"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="660" cy="100" r="45" fill="#fff8d0" opacity="0.9" filter="url(#glow)"/>
  <circle cx="660" cy="100" r="30" fill="#ffffff"/>

  <!-- Clouds -->
  <ellipse cx="180" cy="85" rx="100" ry="25" fill="white" opacity="0.8"/>
  <ellipse cx="230" cy="74" rx="75" ry="20" fill="white" opacity="0.85"/>
  <ellipse cx="450" cy="65" rx="85" ry="22" fill="white" opacity="0.7"/>

  <!-- Tagus River -->
  <rect x="0" y="380" width="800" height="120" fill="url(#river)"/>
  <!-- River shimmer -->
  <ellipse cx="250" cy="400" rx="120" ry="7" fill="rgba(255,255,255,0.12)"/>
  <ellipse cx="600" cy="408" rx="100" ry="6" fill="rgba(255,255,255,0.1)"/>

  <!-- Distant shore / Almada -->
  <rect x="0" y="360" width="800" height="28" fill="#7a9878" opacity="0.4"/>

  <!-- Alfama hillside -->
  <ellipse cx="400" cy="310" rx="420" ry="120" fill="url(#hill)"/>

  <!-- São Jorge Castle on the hill — center-top -->
  <!-- Castle base wall -->
  <rect x="270" y="180" width="260" height="130" fill="#c8a068"/>
  <!-- Battlements top -->
  <rect x="268" y="174" width="20" height="16" fill="#c8a068"/>
  <rect x="296" y="174" width="20" height="16" fill="#c8a068"/>
  <rect x="324" y="174" width="20" height="16" fill="#c8a068"/>
  <rect x="352" y="174" width="20" height="16" fill="#c8a068"/>
  <rect x="380" y="174" width="20" height="16" fill="#c8a068"/>
  <rect x="408" y="174" width="20" height="16" fill="#c8a068"/>
  <rect x="436" y="174" width="20" height="16" fill="#c8a068"/>
  <rect x="464" y="174" width="20" height="16" fill="#c8a068"/>
  <rect x="492" y="174" width="20" height="16" fill="#c8a068"/>
  <!-- Keep tower -->
  <rect x="345" y="130" width="110" height="55" fill="#d8b070"/>
  <rect x="342" y="124" width="20" height="14" fill="#d8b070"/>
  <rect x="370" y="124" width="20" height="14" fill="#d8b070"/>
  <rect x="398" y="124" width="20" height="14" fill="#d8b070"/>
  <rect x="426" y="124" width="20" height="14" fill="#d8b070"/>
  <!-- Tower flag -->
  <rect x="396" y="100" width="3" height="28" fill="#888"/>
  <rect x="399" y="100" width="18" height="11" fill="#006600"/>
  <rect x="399" y="106" width="18" height="5" fill="#ff0000"/>
  <!-- Castle windows/arrow slits -->
  <rect x="295" y="198" width="10" height="22" fill="#8a6840" rx="1"/>
  <rect x="325" y="198" width="10" height="22" fill="#8a6840" rx="1"/>
  <rect x="460" y="198" width="10" height="22" fill="#8a6840" rx="1"/>
  <rect x="490" y="198" width="10" height="22" fill="#8a6840" rx="1"/>
  <rect x="365" y="148" width="10" height="22" fill="#8a6840" rx="1"/>
  <rect x="393" y="148" width="10" height="22" fill="#8a6840" rx="1"/>
  <rect x="421" y="148" width="10" height="22" fill="#8a6840" rx="1"/>
  <!-- Castle gate -->
  <rect x="375" y="258" width="50" height="52" fill="#8a6840" rx="2"/>
  <path d="M375,258 Q400,238 425,258" fill="#8a6840"/>

  <!-- Alfama buildings stacked on hillside -->
  <!-- Row of colourful houses -->
  <rect x="120" y="270" width="35" height="60" fill="#e8d0a0" rx="2"/>
  <rect x="158" y="260" width="32" height="70" fill="#f0c880" rx="2"/>
  <rect x="193" y="268" width="30" height="62" fill="#e0b870" rx="2"/>
  <rect x="226" y="272" width="34" height="58" fill="#f0d890" rx="2"/>
  <rect x="540" y="265" width="35" height="65" fill="#e8c880" rx="2"/>
  <rect x="578" y="272" width="32" height="58" fill="#f0d090" rx="2"/>
  <rect x="613" y="260" width="30" height="70" fill="#e0b870" rx="2"/>
  <rect x="646" y="268" width="36" height="62" fill="#f0c880" rx="2"/>
  <!-- Windows on houses -->
  <rect x="128" y="280" width="10" height="12" fill="#7ab8d8" rx="1"/>
  <rect x="145" y="280" width="10" height="12" fill="#7ab8d8" rx="1"/>
  <rect x="165" y="270" width="10" height="12" fill="#7ab8d8" rx="1"/>
  <rect x="550" y="275" width="10" height="12" fill="#7ab8d8" rx="1"/>
  <rect x="621" y="272" width="10" height="12" fill="#7ab8d8" rx="1"/>
  <!-- Rooftops -->
  <rect x="120" y="267" width="35" height="6" fill="#c87840"/>
  <rect x="158" y="257" width="32" height="6" fill="#d88848"/>
  <rect x="193" y="265" width="30" height="6" fill="#c87840"/>
  <rect x="226" y="269" width="34" height="6" fill="#d88848"/>
  <rect x="540" y="262" width="35" height="6" fill="#c87840"/>
  <rect x="578" y="269" width="32" height="6" fill="#d88848"/>
  <rect x="613" y="257" width="30" height="6" fill="#c87840"/>
  <rect x="646" y="265" width="36" height="6" fill="#d88848"/>

  <!-- Tram line road -->
  <rect x="0" y="330" width="800" height="15" fill="#9a9080"/>
  <!-- Tram tracks -->
  <line x1="0" y1="336" x2="800" y2="336" stroke="#7a7068" stroke-width="2"/>
  <line x1="0" y1="342" x2="800" y2="342" stroke="#7a7068" stroke-width="2"/>
  <!-- Track sleepers -->
  <rect x="80" y="334" width="3" height="10" fill="#6a6058" opacity="0.6"/>
  <rect x="120" y="334" width="3" height="10" fill="#6a6058" opacity="0.6"/>
  <rect x="160" y="334" width="3" height="10" fill="#6a6058" opacity="0.6"/>
  <rect x="200" y="334" width="3" height="10" fill="#6a6058" opacity="0.6"/>
  <rect x="240" y="334" width="3" height="10" fill="#6a6058" opacity="0.6"/>
  <rect x="500" y="334" width="3" height="10" fill="#6a6058" opacity="0.6"/>
  <rect x="540" y="334" width="3" height="10" fill="#6a6058" opacity="0.6"/>
  <rect x="580" y="334" width="3" height="10" fill="#6a6058" opacity="0.6"/>
  <rect x="620" y="334" width="3" height="10" fill="#6a6058" opacity="0.6"/>

  <!-- Yellow tram -->
  <rect x="290" y="307" width="130" height="28" fill="#f5c800" rx="3"/>
  <!-- Tram roof -->
  <rect x="296" y="300" width="118" height="10" fill="#e8b800" rx="2"/>
  <!-- Windows -->
  <rect x="298" y="311" width="18" height="12" fill="#c8e8f8" rx="1"/>
  <rect x="322" y="311" width="18" height="12" fill="#c8e8f8" rx="1"/>
  <rect x="346" y="311" width="18" height="12" fill="#c8e8f8" rx="1"/>
  <rect x="370" y="311" width="18" height="12" fill="#c8e8f8" rx="1"/>
  <!-- Tram door -->
  <rect x="395" y="307" width="16" height="28" fill="#e8b800" rx="1"/>
  <!-- Wheels -->
  <circle cx="310" cy="338" r="6" fill="#4a4a4a"/>
  <circle cx="390" cy="338" r="6" fill="#4a4a4a"/>
  <!-- Pantograph -->
  <line x1="350" y1="300" x2="350" y2="285" stroke="#888" stroke-width="2"/>
  <line x1="345" y1="285" x2="360" y2="285" stroke="#888" stroke-width="2"/>

  <!-- 25 de Abril Bridge cables (far right, partial) -->
  <rect x="720" y="250" width="18" height="140" fill="#c84020"/>
  <line x1="729" y1="250" x2="680" y2="345" stroke="#a03010" stroke-width="2"/>
  <line x1="729" y1="250" x2="760" y2="345" stroke="#a03010" stroke-width="2"/>
  <rect x="790" y="270" width="18" height="120" fill="#c84020"/>

  <!-- Azulejo tile detail on house (decorative) -->
  <rect x="160" y="275" width="20" height="20" fill="#4488b8" opacity="0.7"/>
  <rect x="163" y="278" width="6" height="6" fill="#66aacc" opacity="0.8"/>
  <rect x="171" y="278" width="6" height="6" fill="#66aacc" opacity="0.8"/>
  <rect x="163" y="286" width="6" height="6" fill="#66aacc" opacity="0.8"/>
  <rect x="171" y="286" width="6" height="6" fill="#66aacc" opacity="0.8"/>
</svg>
