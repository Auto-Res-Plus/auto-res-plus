  <rect x="140" y="185" width="30" height="195" fill="#e8d8b0"/>
  <rect x="630" y="185" width="30" height="195" fill="#e8d8b0"/>

  <!-- Ground plaza -->
  <rect x="0" y="380" width="800" height="120" fill="url(#ground)"/>
  <!-- Plaza tiles -->
  <line x1="0" y1="395" x2="800" y2="395" stroke="#b89860" stroke-width="1" opacity="0.4"/>
  <line x1="0" y1="410" x2="800" y2="410" stroke="#b89860" stroke-width="1" opacity="0.4"/>
  <line x1="0" y1="425" x2="800" y2="425" stroke="#b89860" stroke-width="1" opacity="0.4"/>

  <!-- Fountain -->
  <ellipse cx="400" cy="410" rx="60" ry="18" fill="#7ab8d8" opacity="0.6"/>
  <ellipse cx="400" cy="406" rx="40" ry="10" fill="#a0d0e8" opacity="0.5"/>
