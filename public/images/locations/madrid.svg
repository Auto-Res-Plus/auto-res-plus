<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a6fa8"/>
      <stop offset="60%" stop-color="#4aa0d8"/>
      <stop offset="100%" stop-color="#80c4e8"/>
    </linearGradient>
    <linearGradient id="palace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0e8d0"/>
      <stop offset="100%" stop-color="#d8c8a0"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8a870"/>
      <stop offset="100%" stop-color="#a88850"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="680" cy="90" r="50" fill="#ffe066" opacity="0.9" filter="url(#glow)"/>
  <circle cx="680" cy="90" r="35" fill="#fff0a0"/>

  <!-- Clouds -->
  <ellipse cx="200" cy="80" rx="100" ry="28" fill="white" opacity="0.85"/>
  <ellipse cx="250" cy="68" rx="80" ry="24" fill="white" opacity="0.9"/>
  <ellipse cx="160" cy="85" rx="60" ry="20" fill="white" opacity="0.7"/>
  <ellipse cx="500" cy="60" rx="90" ry="22" fill="white" opacity="0.7"/>
