<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4a261"/>
      <stop offset="40%" stop-color="#e76f51"/>
      <stop offset="100%" stop-color="#264653"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#457b9d"/>
      <stop offset="100%" stop-color="#1d3557"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b705c"/>
      <stop offset="100%" stop-color="#3d405b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- Sun glow -->
  <circle cx="620" cy="160" r="55" fill="#f4d35e" opacity="0.5"/>
  <circle cx="620" cy="160" r="35" fill="#f4d35e" opacity="0.8"/>

  <!-- Clouds -->
  <ellipse cx="150" cy="100" rx="80" ry="22" fill="rgba(255,200,150,0.3)"/>
  <ellipse cx="200" cy="90" rx="60" ry="18" fill="rgba(255,200,150,0.25)"/>
  <ellipse cx="650" cy="80" rx="70" ry="20" fill="rgba(255,200,150,0.2)"/>

  <!-- River Seine -->
  <rect x="0" y="360" width="800" height="80" fill="url(#river)" opacity="0.85"/>
  <!-- River shimmer -->
  <ellipse cx="200" cy="385" rx="90" ry="6" fill="rgba(255,220,100,0.25)"/>
  <ellipse cx="550" cy="390" rx="70" ry="5" fill="rgba(255,220,100,0.2)"/>

  <!-- Background city skyline -->
  <rect x="0" y="290" width="800" height="80" fill="#2a3a4a" opacity="0.6"/>
  <!-- Building silhouettes bg -->
  <rect x="20" y="260" width="30" height="30" fill="#1d2d3a" opacity="0.7"/>
  <rect x="60" y="250" width="40" height="40" fill="#1d2d3a" opacity="0.7"/>
  <rect x="110" y="255" width="25" height="35" fill="#1d2d3a" opacity="0.7"/>
  <rect x="600" y="255" width="35" height="35" fill="#1d2d3a" opacity="0.7"/>
  <rect x="645" y="248" width="28" height="42" fill="#1d2d3a" opacity="0.7"/>
  <rect x="690" y="260" width="45" height="30" fill="#1d2d3a" opacity="0.7"/>
  <rect x="740" y="252" width="30" height="38" fill="#1d2d3a" opacity="0.7"/>

  <!-- Haussmann buildings left -->
  <rect x="0" y="270" width="120" height="90" fill="#4a5568" rx="2"/>
  <rect x="5" y="262" width="110" height="12" fill="#5a6578"/>
  <!-- Windows left building -->
  <rect x="15" y="278" width="18" height="22" fill="#f4d35e" opacity="0.7"/>
  <rect x="42" y="278" width="18" height="22" fill="#f4d35e" opacity="0.5"/>
  <rect x="69" y="278" width="18" height="22" fill="#f4d35e" opacity="0.8"/>
  <rect x="96" y="278" width="18" height="22" fill="#f4d35e" opacity="0.4"/>
  <rect x="15" y="310" width="18" height="22" fill="#f4d35e" opacity="0.5"/>
  <rect x="42" y="310" width="18" height="22" fill="#f4d35e" opacity="0.7"/>
  <rect x="69" y="310" width="18" height="22" fill="#f4d35e" opacity="0.3"/>
  <rect x="96" y="310" width="18" height="22" fill="#f4d35e" opacity="0.6"/>

  <!-- Haussmann buildings right -->
  <rect x="660" y="265" width="140" height="95" fill="#4a5568" rx="2"/>
  <rect x="665" y="257" width="130" height="12" fill="#5a6578"/>
  <rect x="672" y="272" width="18" height="22" fill="#f4d35e" opacity="0.6"/>
  <rect x="700" y="272" width="18" height="22" fill="#f4d35e" opacity="0.4"/>
  <rect x="728" y="272" width="18" height="22" fill="#f4d35e" opacity="0.8"/>
  <rect x="756" y="272" width="18" height="22" fill="#f4d35e" opacity="0.5"/>
  <rect x="672" y="304" width="18" height="22" fill="#f4d35e" opacity="0.7"/>
  <rect x="700" y="304" width="18" height="22" fill="#f4d35e" opacity="0.3"/>
  <rect x="728" y="304" width="18" height="22" fill="#f4d35e" opacity="0.5"/>
  <rect x="756" y="304" width="18" height="22" fill="#f4d35e" opacity="0.7"/>

  <!-- Notre Dame silhouette (left of tower) -->
  <rect x="140" y="295" width="130" height="65" fill="#3d4a58"/>
  <polygon points="170,295 205,260 240,295" fill="#3d4a58"/>
  <!-- Notre dame towers -->
  <rect x="145" y="258" width="28" height="40" fill="#3d4a58"/>
  <rect x="238" y="258" width="28" height="40" fill="#3d4a58"/>
  <rect x="153" y="248" width="12" height="14" fill="#3d4a58"/>
  <rect x="246" y="248" width="12" height="14" fill="#3d4a58"/>
  <!-- rose windows -->
  <circle cx="205" cy="280" r="10" fill="rgba(244,211,94,0.3)"/>

  <!-- Eiffel Tower — centered -->
  <!-- Base legs -->
  <polygon points="340,360 370,200 400,200 390,360" fill="url(#tower)"/>
  <polygon points="410,360 400,200 430,200 460,360" fill="url(#tower)"/>
  <!-- Leg arches -->
  <path d="M340,360 Q370,310 400,310 Q430,310 460,360" fill="none" stroke="#3d405b" stroke-width="8"/>
  <!-- Second stage -->
  <polygon points="355,290 370,200 430,200 445,290" fill="#5c6370"/>
  <rect x="350" y="285" width="100" height="10" fill="#4a5260"/>
  <!-- First stage -->
  <polygon points="365,240 375,200 425,200 435,240" fill="#6b7280"/>
  <rect x="360" y="235" width="80" height="8" fill="#555b66"/>
  <!-- Shaft -->
  <rect x="390" y="120" width="20" height="85" fill="#6b7280"/>
  <!-- Antenna -->
  <rect x="398" y="80" width="4" height="45" fill="#8a9099"/>
  <!-- Light beacon -->
  <circle cx="400" cy="78" r="4" fill="#f4d35e" filter="url(#glow)" opacity="0.9"/>
  <!-- Horizontal cross beams -->
  <rect x="352" y="255" width="96" height="4" fill="#4a5260"/>
  <rect x="358" y="218" width="84" height="4" fill="#4a5260"/>
  <!-- Lattice detail lines -->
  <line x1="370" y1="360" x2="382" y2="295" stroke="#8a9099" stroke-width="1.5" opacity="0.6"/>
  <line x1="430" y1="360" x2="418" y2="295" stroke="#8a9099" stroke-width="1.5" opacity="0.6"/>
  <line x1="375" y1="290" x2="385" y2="240" stroke="#8a9099" stroke-width="1" opacity="0.5"/>
  <line x1="425" y1="290" x2="415" y2="240" stroke="#8a9099" stroke-width="1" opacity="0.5"/>

  <!-- Pont bridge -->
  <rect x="270" y="355" width="260" height="10" fill="#5a6070" rx="2"/>
  <rect x="280" y="348" width="8" height="12" fill="#6a7080"/>
  <rect x="306" y="348" width="8" height="12" fill="#6a7080"/>
  <rect x="332" y="348" width="8" height="12" fill="#6a7080"/>
  <rect x="358" y="348" width="8" height="12" fill="#6a7080"/>
  <rect x="384" y="348" width="8" height="12" fill="#6a7080"/>
  <rect x="410" y="348" width="8" height="12" fill="#6a7080"/>
  <rect x="436" y="348" width="8" height="12" fill="#6a7080"/>
  <rect x="462" y="348" width="8" height="12" fill="#6a7080"/>
  <rect x="510" y="348" width="8" height="12" fill="#6a7080"/>

  <!-- Ground -->
  <rect x="0" y="355" width="800" height="15" fill="#2d3a2d" opacity="0.8"/>

  <!-- Trees -->
  <rect x="245" y="325" width="8" height="35" fill="#3d4a2d"/>
  <circle cx="249" cy="315" r="20" fill="#3a5a2a"/>
  <rect x="540" y="325" width="8" height="35" fill="#3d4a2d"/>
  <circle cx="544" cy="315" r="20" fill="#3a5a2a"/>
  <rect x="575" y="330" width="7" height="28" fill="#3d4a2d"/>
  <circle cx="578" cy="322" r="16" fill="#4a6a38"/>

  <!-- Reflection in river -->
  <rect x="375" y="368" width="50" height="60" fill="#3d405b" opacity="0.3"/>
  <ellipse cx="400" cy="430" rx="25" ry="6" fill="#f4d35e" opacity="0.12"/>
</svg>
